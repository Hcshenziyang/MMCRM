version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: mycrm
      MYSQL_ROOT_PASSWORD: was13579
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: django_backend
    command: gunicorn mycrm.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=mycrm
      - DATABASE_USER=root
      - DATABASE_PASSWORD=was13579
      - REDIS_HOST=redis
      - ALLOWED_HOSTS=*
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    restart: always

  frontend:
    image: nginx:alpine
    container_name: frontend
    volumes:
      - ./frontend/unpackage/dist/build/web:/usr/share/nginx/html/crm
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    restart: always

volumes:
  mysql_data:
