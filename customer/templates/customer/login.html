{% extends "customer/base.html" %}

{% block title %}登录 - 喵喵CRM{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
    <h2 style="text-align: center;">登录</h2>

    <form method="post">
        {% csrf_token %}

        <!-- 用户名 -->
        <div style="margin-bottom: 15px;">
            <label for="username" style="display: block; margin-bottom: 5px; color: #555;">用户名</label>
            <input type="text" name="username" id="username" required
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px;">
            {% if form_errors.username %}
                <div style="color: red; font-size: 14px; margin-top: 5px;">{{ form_errors.username }}</div>
            {% endif %}
        </div>

        <!-- 密码 -->
        <div style="margin-bottom: 15px;">
            <label for="password" style="display: block; margin-bottom: 5px; color: #555;">密码</label>
            <input type="password" name="password" id="password" required
                   style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px;">
            {% if form_errors.password %}
                <div style="color: red; font-size: 14px; margin-top: 5px;">{{ form_errors.password }}</div>
            {% endif %}
        </div>

        <button type="submit" style="width: 100%; padding: 12px; font-size: 18px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">登录</button>
    </form>
</div>
{% endblock %}
